services:
  database:
    image: mysql:8.0
    container_name: dental_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dental_db
      MYSQL_USER: dental_user
      MYSQL_PASSWORD: dental_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: dental_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=database
      - DB_USER=dental_user
      - DB_PASSWORD=dental_password
      - DB_NAME=dental_db
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: dental_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

