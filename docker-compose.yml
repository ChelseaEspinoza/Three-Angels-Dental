services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dental_db
      MYSQL_USER: dental_user
      MYSQL_PASSWORD: dental_password
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - DB_HOST=database
      - DB_USER=dental_user
      - DB_PASSWORD=dental_password
      - DB_NAME=dental_db
    expose:
      - "5000"
    depends_on:
      - database

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  db_data:
