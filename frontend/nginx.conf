server {
    # Permite subir imágenes y videos desde el panel de administración (hasta 100 MB).
    client_max_body_size 100m;
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para que la web cargue más rápido
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API (backend Node.js): /api/... -> backend:5000/...
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Videos grandes: se envían al backend sin esperar a recibirlos completos
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # config.js se edita a mano: que el navegador siempre pida la versión nueva
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # Archivos de la web (CSS, JS, imágenes): se guardan en caché 7 días
    location /assets/ {
        expires 7d;
    }

    # Páginas del sitio (/servicios, /tienda, /admin...): todas usan index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
